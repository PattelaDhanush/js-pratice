<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Tic Tac Toe</title>
        <style>
            body {
                background: #f5d142;
                font-family: cursive;
                align-content: center;
                margin: auto;
                text-align: center;
            }
            button {
                padding: 8px 16px;
                border-radius: 4px;
                font-size: 1rem;
            }
            .row {
                display: flex;
            }
            #game-layout{
                place-self: center;
                margin-top: 24px;
                border-collapse: collapse;
                display: none;
            }
            #player {
                margin-top: 16px;
                font-size: 18px; 
                font-weight: 600;
                display: none; 
            }
            td {
            height: 48px;
            padding: 8px;
            width: 48px;
            text-align: center;
            align-content: center;
            }
            #score-card{
                display: flex;
                justify-content: center;
            }
            .score-card-label{
                padding: 1rem;
                margin: 16px 1rem;
                border: 2px solid darkslategrey;
                border-radius: 8px;
                cursor: pointer;
                display: flex;
                flex-direction: row;
                place-items: center;
            }
            .score-card-label div {
                padding: 0px 1rem;
                font-size: 24px;
                padding-left: 2rem;
            }
            #row-2 {
                border-top: 5px solid brown;
                border-bottom: 5px solid brown;
            }
            #col-2 {
                border-right: 5px solid brown;
                border-left: 5px solid brown;
            }
            .board {
                position: relative;
                display: inline-block;
                margin-bottom: 2rem;
            }
            #play-again{
                display: none;
            }
            button:active {
                outline: none;
                background-color: inherit; 
            }
            @media only screen and (max-width: 314px) {
                #score-card {
                    display: block;
                }
            }
        </style>
    </head>
    <body>
        <h1 id="main-heading">Tic Tac Toe</h1>
        <button id="start-btn">Start Game</button>
        <div id="score-card">
            <div id="score-card-label-X" class="score-card-label">
                <img src="images/X_icon.png" height="30px" width="30px" alt="X">
                <div id="score-X">0</div>
            </div>
            <div id="score-card-label-O" class="score-card-label">
                <img src="images/O_icon.png" height="30px" width="30px" alt="O">
                <div id="score-O">0</div>
            </div>
        </div>
        <div id="player">
            <span id="player-symbol">
                <img src="images/X_icon.png" height="30px" width="30px" alt="X">
            </span> Turn</div>
        <div id="board" class="board">
            <table id="game-layout">
                <tr id="row-1" class="row">
                    <td id="col-1" class="col"></td>
                    <td id="col-2" class="col"></td>
                    <td id="col-3" class="col"></td>
                </tr>
                <tr id="row-2" class="row">
                    <td id="col-1" class="col"></td>
                    <td id="col-2" class="col"></td>
                    <td id="col-3" class="col"></td>
                </tr>
                <tr id="row-3" class="row">
                    <td id="col-1" class="col"></td>
                    <td id="col-2" class="col"></td>
                    <td id="col-3" class="col"></td>
                </tr>
            </table>
            <div id="winner-banner">
                <h2 id="winner-player-symbol"></h2>
            </div>    
        </div>    
        <div id="result"></div>
        <button id="play-again">Play Again</button>
    </body>
    <script src="script.js"></script>
</html>
